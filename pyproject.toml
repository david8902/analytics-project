[project]
name = "analytics-project"
version = "0.1.0"
description = "Proyecto de Analítica de Datos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.0",
    "pandera>=0.32.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Los tests del laboratorio se entregan tal cual los da la guia: comparan
# contra True/False explicitamente (E712) y no deben modificarse.
"tests/*" = ["E712"]